# Optional overlay for hosts that already run their own MongoDB/Redis.
#
# Ernest brings its OWN mongodb and redis on an isolated bridge network, so it never
# touches the host's existing services -- the only clash is the published host ports.
# This overlay stops publishing 27017/6379 to the host: the containers still talk to
# each other internally (mongodb:27017, redis:6379), they just aren't exposed on the
# host, so there's nothing to collide with.
#
#   docker compose -f docker-compose.yml -f docker-compose.shared-host.yml up -d
#
# `!reset []` clears the list from the base file (a plain `ports: []` would MERGE and
# leave the base entry in place). Requires Docker Compose v2.24+. On older Compose,
# use `!override` with a free host port instead (see the commented block below).

services:
  mongodb:
    ports: !reset []

  redis:
    ports: !reset []

