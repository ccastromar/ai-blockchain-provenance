name: Publish Images

# A release tag (v*) scans (Trivy) and publishes Ernest's images to GHCR with an SBOM and build provenance attached,
# and signs each with Sigstore cosign (keyless: the identity is this workflow run). Run by hand it
# only builds, unless "publish" is ticked. The console image is built without an identity
# provider or app URLs (those are build arguments): it suits API-key access; a deployment with
# SSO builds its own. How to verify an image: SECURITY.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push, attest and sign (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # keyless signing

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  image:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: backend/Dockerfile
          - name: event-ingestor
            file: event-ingestor/Dockerfile
          - name: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Scan before publishing: a critical vulnerability with a fix available stops the release.
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: scan/${{ matrix.name }}:local
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'

      - name: Sign
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
