name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Real MongoDB for the HTTP auth-matrix integration suite (test/http-auth-matrix.test.js);
    # the suite skips itself with a warning when no Mongo is reachable, so local runs
    # without the docker stack still pass — CI always exercises it.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integrity tests
        run: pnpm --filter ernest-backend test:integrity

      # Fails on any high or critical advisory in production dependencies (backend workspace and
      # the console). Accepted exceptions live in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
      - name: Dependency audit (production, high and above)
        run: pnpm run audit:prod

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # @chestertown/design installs from the vendored tarball in frontend/vendor.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      # The console against a mocked API and identity provider: what each governance function
      # sees, no access without one, and a switched identity-provider session ending ours.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

  blockchain:
    name: Blockchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm --filter blockchain compile

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-ernest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli-ernest/go.mod
          cache-dependency-path: cli-ernest/go.sum

      - name: Test (incl. testcontainers Mongo integration)
        # ./... runs every package, incl. sigverify golden tests and the testcontainers
        # Mongo integration tests (they self-provision a container; CI runners have
        # Docker, and the tests skip gracefully where it's absent).
        run: go test ./...

      - name: Build CLI
        run: go build -o ernest .

  merkle-wasm:
    name: Merkle WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merkle-wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: merkle-wasm

      - name: Test
        run: cargo test

  event-ingestor:
    name: Event Ingestor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-ingestor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: event-ingestor/go.mod
          cache-dependency-path: event-ingestor/go.sum

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  scripts:
    name: Scripts and Python Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check shell scripts
        run: bash -n scripts/smoke.sh scripts/deploy-check.sh setup.sh agentic-auditor/run.sh

      - name: Check Python syntax
        run: python -m compileall ai-sandbox/domains/iris agentic-auditor/app

      - name: Test auditor agent helpers
        run: |
          python -m pip install -r agentic-auditor/requirements.txt
          PYTHONPATH=agentic-auditor python -m unittest discover -s agentic-auditor/tests
