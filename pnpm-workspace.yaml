packages:
  - backend
  - blockchain

confirmModulesPurge: false

onlyBuiltDependencies:
  - esbuild
  - keccak

ignoredBuiltDependencies:
  - "@scarf/scarf"
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  keccak: true
  protobufjs: false

overrides:
  multer: 2.5.0
  # opentimestamps still pulls the deprecated request, which pins form-data 2.3; 2.5.6 is the
  # same API with the boundary-randomness fix.
  'form-data@<2.5.6': 2.5.6
