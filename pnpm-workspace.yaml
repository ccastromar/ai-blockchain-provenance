packages:
  - backend
  - blockchain

confirmModulesPurge: false

onlyBuiltDependencies:
  - esbuild
  - keccak

ignoredBuiltDependencies:
  - "@scarf/scarf"
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  keccak: true
  protobufjs: false

overrides:
  multer: 2.5.0
  # opentimestamps still pulls the deprecated request, which pins form-data 2.3; 2.5.6 is the
  # same API with the boundary-randomness fix.
  'form-data@<2.5.6': 2.5.6
  # Patched versions for advisories in the backend's runtime tree, mostly under opentimestamps
  # (bitcore-lib, request): same major API, so the old callers keep working.
  'bn.js@<4.12.3': 4.12.3
  'js-yaml@>=5.0.0 <5.4.1': 5.4.1
  'qs@<6.16.0': 6.16.0
  'tough-cookie@<4.1.3': 4.1.3
  # Dev tooling (typescript-eslint): the patched 9.x line.
  'minimatch@>=9.0.0 <9.0.7': 9.0.9
