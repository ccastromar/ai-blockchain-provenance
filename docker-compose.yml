version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ernest-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ernest
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ernest-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ernest-backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/ernest
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
      - ERNEST_API_KEY=${ERNEST_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ernest-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend-svelte/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
        PUBLIC_ERNEST_API_KEY: ${PUBLIC_ERNEST_API_KEY:-}
    container_name: ernest-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ernest-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  ernest-network:
    driver: bridge
