[package]
name = "merkle-wasm"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
hex = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true

