[package]
name = "merkle-wasm"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
hex = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# ADR-002 B2: qualified electronic seal (qeseal-ecdsa-p256) verification in the browser.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
x509-cert = { version = "0.2", default-features = false }
spki = { version = "0.7", default-features = false, features = ["alloc"] }
der = { version = "0.7", default-features = false, features = ["alloc"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true

