server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The HTTP event-ingestor is optional (a deployment may ingest over Kafka only). Resolve it
  # per request through Docker's DNS instead of at startup, so nginx still starts without it;
  # /ingestor/ then answers 502 while the rest of the UI keeps working.
  location /ingestor/ {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $ingestor_upstream event-ingestor:3011;
    rewrite ^/ingestor/(.*)$ /$1 break;
    proxy_pass http://$ingestor_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /_app/env.js {
    add_header Cache-Control "no-store, max-age=0";
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
